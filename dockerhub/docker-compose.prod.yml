services:
  app:
    image: khai1301/matching_system:php
    container_name: matching_system_app
    restart: always
    volumes:
      - ./.env:/var/www/.env
      - storage:/var/www/storage
    networks:
      - laravel

  nginx:
    image: khai1301/matching_system:nginx
    container_name: matching_system_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

volumes:
  storage:
    driver: local
networks:
  laravel:
    driver: bridge