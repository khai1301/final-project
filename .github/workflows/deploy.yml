name: Laravel CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      #login to docker hub
      - name: login to docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build PHP image
        run: docker build --no-cache -f dockerhub/Dockerfile.prod --target php -t khai1301/matching_system:php .
      - name: Build Nginx image
        run: docker build --no-cache -f dockerhub/Dockerfile.prod --target nginx -t khai1301/matching_system:nginx .
      - name: Push images
        run: |
          docker push khai1301/matching_system:php
          docker push khai1301/matching_system:nginx

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/final-project
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml run --rm app php artisan migrate --force
            docker compose -f docker-compose.prod.yml run --rm app php artisan optimize
